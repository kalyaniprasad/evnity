name: evnity
description: Evnity - Campus Event Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  #firebase setup
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.1
  firebase_messaging: ^15.2.10

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # UI & Fonts
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0

  # Auth
  google_sign_in: ^6.2.0
  image_picker: ^1.2.1
  http: ^1.6.0
  firebase_database: ^11.3.10
  intl: ^0.20.2
  table_calendar: ^3.2.0
  flutter_local_notifications: ^21.0.0
  audioplayers: ^6.1.0

  # New features
  excel: ^4.0.0
  file_picker: ^8.1.3
  path_provider: ^2.1.3
  share_plus: ^10.1.0
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1 



  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/evnity_logo.jpeg"

  
flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
